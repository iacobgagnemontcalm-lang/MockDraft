name: Update rankings

on:
  schedule:
    - cron: '0 10 * * *'   # daily 10:00 UTC (6am ET)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4 openpyxl

      - name: Refresh ranking CSVs
        run: python scripts/update_rankings.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rankings.csv adp_rankings.csv sleeper_rankings.csv
          if git diff --cached --quiet; then
            echo "Rankings already up to date — nothing to commit"
            exit 0
          fi
          git commit -m "Daily rankings update ($(date -u +%Y-%m-%d))"
          git push
